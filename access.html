<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Virorah Vantage</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#050410;color:#f4f3ff;font-family:'Plus Jakarta Sans',sans-serif}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;
      background-image:linear-gradient(rgba(99,102,241,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.025) 1px,transparent 1px);
      background-size:48px 48px;padding:24px}
    .wrap{width:100%;max-width:440px;animation:fadeIn .4s ease}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
    .logo-dot{width:10px;height:10px;border-radius:50%;background:#6366f1;box-shadow:0 0 14px rgba(99,102,241,.7);animation:pulse 2s ease-in-out infinite}
    .logo-name{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;color:#f4f3ff}
    .logo-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(165,180,252,.5);margin-top:2px}
    #loading-state{text-align:center;padding:48px 32px;background:#0d0b1e;border:1px solid rgba(99,102,241,.18);border-radius:16px}
    .spinner{width:28px;height:28px;border:2px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
    .loading-text{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(165,180,252,.5)}
    #clerk-container{display:none}
    .meridian-chip{margin-top:20px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.14);border-radius:10px;padding:14px 18px;text-align:center}
    .meridian-chip-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:#a5b4fc;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
    .meridian-chip-text{font-size:12px;color:rgba(244,243,255,.4);line-height:1.55}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row">
      <div class="logo-dot"></div>
      <div>
        <div class="logo-name">Virorah</div>
        <div class="logo-sub">Vantage</div>
      </div>
    </div>
    <div id="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">Initialising secure sign-in&hellip;</div>
    </div>
    <div id="clerk-container"></div>

    <!-- Forgot password fallback — links to Clerk Account Portal reset flow -->
    <div id="forgot-pw-link" style="display:none;text-align:center;margin-top:14px">
      <a href="https://brief-koi-76.accounts.dev/sign-in#/forgot-password"
         style="font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(165,180,252,0.55);text-decoration:none;letter-spacing:.04em;transition:color .2s"
         onmouseover="this.style.color='#a5b4fc'" onmouseout="this.style.color='rgba(165,180,252,0.55)'">
        Forgot password?
      </a>
    </div>
    <div class="meridian-chip" id="meridian-chip" style="display:none">
      <div class="meridian-chip-label">MERIDIAN Inside</div>
      <div class="meridian-chip-text">Seven parameters calibrate every result to your exact professional reality — your state, industry, org type, seniority, and more.</div>
    </div>
  </div>

  <script>
    var PUBLISHABLE_KEY = 'pk_test_YnJpZWYta29pLTc2LmNsZXJrLmFjY291bnRzLmRldiQ';
    var CLERK_DOMAIN    = 'https://brief-koi-76.clerk.accounts.dev';
    var WORKER_URL      = 'https://situation-room-api.kumarvivek-srv.workers.dev';
    var DASHBOARD_URL   = 'https://vantage.virorah.com/dashboard.html';

    function getRedirectUrl() {
      try {
        var params = new URLSearchParams(window.location.search);
        var r = params.get('redirect_url') || '';
        if (r && r.indexOf('https://vantage.virorah.com/') === 0) return r;
      } catch(e) {}
      return DASHBOARD_URL;
    }

    function syncUser(user) {
      if (!user) return;
      var email  = (user.primaryEmailAddress && user.primaryEmailAddress.emailAddress) || '';
      var name   = user.firstName || user.fullName || email.split('@')[0] || '';
      var userId = user.id || '';
      sessionStorage.setItem('sr_access',     'true');
      sessionStorage.setItem('sr_user_email', email);
      sessionStorage.setItem('sr_user_name',  name);
      sessionStorage.setItem('sr_user_id',    userId);
      localStorage.setItem('vantage_clerk_signed_in', '1');
      localStorage.setItem('sr_user_email', email);
      localStorage.setItem('sr_user_name',  name);
      if (email) {
        var m = localStorage.getItem('sr_meridian_' + email);
        if (m) sessionStorage.setItem('sr_meridian', m);
      }
    }

    // After sign-in: restore Humac Score and MERIDIAN from Airtable
    async function restoreUserData(token) {
      try {
        var headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

        // Restore Humac Score
        var humacRes = await fetch(WORKER_URL, {
          method: 'POST', headers: headers,
          body: JSON.stringify({ tool: 'get_humac' })
        });
        if (humacRes.ok) {
          var humacData = await humacRes.json();
          if (humacData.success && humacData.data) {
            try { sessionStorage.setItem('vantage_humac', JSON.stringify(humacData.data)); } catch(e) {}
          }
        }

        // Restore MERIDIAN (Airtable takes priority over localStorage)
        var meridianRes = await fetch(WORKER_URL, {
          method: 'POST', headers: headers,
          body: JSON.stringify({ tool: 'get_meridian' })
        });
        if (meridianRes.ok) {
          var meridianData = await meridianRes.json();
          if (meridianData.success && meridianData.data) {
            var meridian = meridianData.data;
            sessionStorage.setItem('sr_meridian', JSON.stringify(meridian));
            // Also cache in localStorage for fast-path on future sign-ins
            var email = sessionStorage.getItem('sr_user_email') || '';
            if (email) localStorage.setItem('sr_meridian_' + email, JSON.stringify(meridian));
          }
        }
      } catch(e) {
        console.warn('[Vantage] Data restore failed:', e);
      }
    }

    function showClerkUI() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('clerk-container').style.display = 'block';
      document.getElementById('meridian-chip').style.display = 'block';
      document.getElementById('forgot-pw-link').style.display = 'block';
      window.Clerk.mountSignIn(document.getElementById('clerk-container'), {
        routing: 'hash',
        appearance: {
          variables: {
            colorPrimary:         '#6366f1',
            colorBackground:      '#050410',
            colorInputBackground: '#0d0b1e',
            colorInputText:       '#f4f3ff',
            colorText:            '#f4f3ff',
            colorTextSecondary:   'rgba(244,243,255,0.5)',
            colorNeutral:         '#a5b4fc',
            colorDanger:          '#f43f5e',
            colorSuccess:         '#10b981',
            borderRadius:         '10px',
            fontFamily:           "'Plus Jakarta Sans', sans-serif",
          },
          layout: {
            socialButtonsVariant: 'iconButton',
            logoPlacement:        'none',
          }
        }
      });
      window.Clerk.addListener(function(resources) {
        if (resources.user) {
          syncUser(resources.user);
          // Restore Humac Score and MERIDIAN from Airtable before redirecting
          window.Clerk.session.getToken().then(function(token) {
            return restoreUserData(token);
          }).then(function() {
            window.location.replace(getRedirectUrl());
          }).catch(function() {
            window.location.replace(getRedirectUrl());
          });
        }
      });
    }

    var s = document.createElement('script');
    s.async = true;
    s.crossOrigin = 'anonymous';
    s.setAttribute('data-clerk-publishable-key', PUBLISHABLE_KEY);
    s.src = CLERK_DOMAIN + '/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';
    s.addEventListener('load', function() {
      window.Clerk.load().then(function() {
        if (window.Clerk.user) {
          syncUser(window.Clerk.user);
          window.Clerk.session.getToken().then(function(token) {
            return restoreUserData(token);
          }).then(function() {
            window.location.replace(getRedirectUrl());
          }).catch(function() {
            window.location.replace(getRedirectUrl());
          });
          return;
        }
        showClerkUI();
      }).catch(function(err) {
        console.error('[Clerk] Load error:', err);
        document.getElementById('loading-state').innerHTML =
          '<div style="font-size:13px;color:rgba(244,243,255,.5);line-height:1.6">Unable to load secure sign-in. Please refresh the page.</div>';
      });
    });
    s.addEventListener('error', function() {
      document.getElementById('loading-state').innerHTML =
        '<div style="font-size:13px;color:rgba(244,243,255,.5);line-height:1.6">Sign-in could not be loaded. Please check your connection and refresh.</div>';
    });
    document.head.appendChild(s);
  </script>
</body>
</html>
