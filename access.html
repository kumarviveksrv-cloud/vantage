<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Virorah Vantage</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#050410;color:#f4f3ff;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .wrap{text-align:center;animation:fadeIn .4s ease}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
    .logo-dot{width:10px;height:10px;border-radius:50%;background:#6366f1;box-shadow:0 0 14px rgba(99,102,241,0.7);animation:pulse 2s ease-in-out infinite}
    .logo-name{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;color:#f4f3ff}
    .logo-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(165,180,252,0.5);margin-top:2px}
    .spinner-wrap{margin:0 auto 24px;width:48px;height:48px}
    .spinner-wrap svg{animation:spin 1.4s linear infinite}
    .status{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(165,180,252,0.55);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .sub-status{font-size:12px;color:rgba(244,243,255,0.25);margin-top:6px}
    .error-wrap{display:none;margin-top:24px}
    .error-msg{font-size:13px;color:#FF4D6D;margin-bottom:16px}
    .retry-btn{padding:12px 28px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.35);border-radius:10px;color:#a5b4fc;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
    .retry-btn:hover{background:rgba(99,102,241,0.2)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row">
      <div class="logo-dot"></div>
      <div>
        <div class="logo-name">Virorah</div>
        <div class="logo-sub">Vantage</div>
      </div>
    </div>
    <div class="spinner-wrap">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(99,102,241,0.12)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="32 95" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="status" id="status-text">Checking your session...</div>
    <div class="sub-status" id="sub-text"></div>
    <div class="error-wrap" id="error-wrap">
      <div class="error-msg" id="error-msg">Authentication failed. Please try again.</div>
      <button class="retry-btn" onclick="window.location.reload()">Try again</button>
    </div>
  </div>

  <!-- Correct Clerk CDN: use your Frontend API URL, not the npm CDN -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YnJpZWYta29pLTc2LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://brief-koi-76.clerk.accounts.dev/.well-known/clerk.js"
    type="text/javascript"
  ></script>

  <script>
    var BASE     = 'https://vantage.virorah.com/';
    var params   = new URLSearchParams(window.location.search);
    var redirect = params.get('redirect') || (BASE + 'dashboard.html');

    function setStatus(main, sub) {
      document.getElementById('status-text').innerText = main;
      document.getElementById('sub-text').innerText = sub || '';
    }

    function showError(msg) {
      document.getElementById('error-wrap').style.display = 'block';
      document.getElementById('error-msg').innerText = msg || 'Authentication failed. Please try again.';
      document.getElementById('sub-text').innerText = '';
    }

    // Wait for Clerk to be ready — it fires 'clerk:loaded' event
    window.addEventListener('load', function() {
      // Clerk auto-initialises via the data-clerk-publishable-key attribute
      // We wait for the global window.Clerk to be available and loaded
      var maxWait = 10000; // 10s timeout
      var waited  = 0;
      var interval = setInterval(function() {
        waited += 200;
        if (waited > maxWait) {
          clearInterval(interval);
          showError('Clerk took too long to load. Please check your connection and retry.');
          return;
        }
        if (window.Clerk && typeof window.Clerk.load === 'function') {
          clearInterval(interval);
          bootClerk();
        }
      }, 200);
    });

    function bootClerk() {
      setStatus('Connecting...', '');
      window.Clerk.load().then(function() {
        if (window.Clerk.user) {
          // Authenticated — store IDs and go
          setStatus('Signed in.', 'Setting up your workspace...');
          localStorage.setItem('sr_user_id', window.Clerk.user.id);
          var email = window.Clerk.user.primaryEmailAddress
            ? window.Clerk.user.primaryEmailAddress.emailAddress
            : '';
          sessionStorage.setItem('sr_user_email', email);
          sessionStorage.setItem('sr_access', 'true');
          setTimeout(function() { window.location.replace(redirect); }, 300);
        } else {
          // Not authenticated — let Clerk handle the redirect to sign-in
          setStatus('Redirecting to sign in...', '');
          window.Clerk.redirectToSignIn({
            redirectUrl: BASE + 'access.html?redirect=' + encodeURIComponent(redirect)
          });
        }
      }).catch(function(err) {
        console.error('Clerk.load() error:', err);
        showError('Could not connect to authentication. Please check your connection and try again.');
      });
    }
  </script>
</body>
</html>
