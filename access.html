<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Virorah Vantage</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#050410;color:#f4f3ff;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .wrap{text-align:center;animation:fadeIn .4s ease}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
    .logo-dot{width:10px;height:10px;border-radius:50%;background:#6366f1;box-shadow:0 0 14px rgba(99,102,241,0.7);animation:pulse 2s ease-in-out infinite}
    .logo-name{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;color:#f4f3ff}
    .logo-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(165,180,252,0.5);margin-top:2px}
    .spinner-wrap{margin:0 auto 24px;width:48px;height:48px}
    .spinner-wrap svg{animation:spin 1.4s linear infinite}
    .status{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(165,180,252,0.55);letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row">
      <div class="logo-dot"></div>
      <div>
        <div class="logo-name">Virorah</div>
        <div class="logo-sub">Vantage</div>
      </div>
    </div>
    <div class="spinner-wrap">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(99,102,241,0.12)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="32 95" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="status" id="status-text">Checking your session...</div>
  </div>

  <script>
    var CLERK_SIGN_IN = 'https://brief-koi-76.clerk.accounts.dev/sign-in';
    var BASE          = 'https://vantage.virorah.com/';

    var params  = new URLSearchParams(window.location.search);
    var token   = params.get('vt');     // session token returned after Clerk sign-in
    var stored  = sessionStorage.getItem('vantage_token');
    var redirect = params.get('redirect') || (BASE + 'dashboard.html');

    // ── CASE 1: Returning from Clerk sign-in with our token ──────────────────
    if (token && stored && token === stored) {
      document.getElementById('status-text').innerText = 'SIGNED IN. SETTING UP...';
      sessionStorage.setItem('sr_access', 'true');

      // Ensure a user ID exists — real Clerk ID will be set later when
      // a Production Clerk instance is configured. For now, preserve any
      // existing ID or generate a new one.
      if (!localStorage.getItem('sr_user_id')) {
        localStorage.setItem('sr_user_id',
          'usr_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now()
        );
      }

      // Clean the token from the URL then redirect
      setTimeout(function () {
        window.location.replace(redirect);
      }, 300);

    // ── CASE 2: Already has a valid session ──────────────────────────────────
    } else if (sessionStorage.getItem('sr_access') === 'true') {
      document.getElementById('status-text').innerText = 'SESSION ACTIVE.';
      window.location.replace(redirect);

    // ── CASE 3: Not authenticated — generate token and send to Clerk ─────────
    } else {
      document.getElementById('status-text').innerText = 'REDIRECTING TO SIGN IN...';

      // Generate a one-time session token — tied to THIS browser session
      var newToken = Math.random().toString(36).substr(2, 12) +
                     Math.random().toString(36).substr(2, 12);
      sessionStorage.setItem('vantage_token', newToken);

      // Clerk redirects back here with ?vt=[token] after successful sign-in
      var returnUrl = BASE + 'access.html?vt=' + newToken +
                      '&redirect=' + encodeURIComponent(redirect);

      setTimeout(function () {
        window.location.replace(
          CLERK_SIGN_IN + '?redirect_url=' + encodeURIComponent(returnUrl)
        );
      }, 200);
    }
  </script>
</body>
</html>
